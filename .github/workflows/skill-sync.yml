name: Skill sync

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate plugin JSON
        run: python3 -m json.tool .claude-plugin/plugin.json > /dev/null
      - name: Compare canonical skill
        # A cross-repository skill update stages the canonical copy first.
        # PRs verify that immutable preparation commit; main and scheduled
        # checks continue to detect drift against the canonical main branch.
        env:
          CANONICAL_REF: ${{ github.event_name == 'pull_request' && 'b1863704da28811e5f0ef5dee327decb4ef788c6' || 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          canonical_skill=$(mktemp)
          trap 'rm -f "$canonical_skill"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/anydoor7/tslink/${CANONICAL_REF}/skills/tslink-preview/SKILL.md" \
            --output "$canonical_skill"
          cmp skills/tslink-preview/SKILL.md "$canonical_skill"
